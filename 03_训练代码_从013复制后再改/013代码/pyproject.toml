[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebsd-ipf-gb-013"
version = "0.3.0"
description = "013 four-channel IPF-Z composite and explicit GB diffusion with frozen image descriptor proxy"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "tensorboard>=2.18,<3",
  "rich>=13.9,<15",
  "tqdm>=4.67,<5",
  "matplotlib>=3.9,<4",
  "safetensors>=0.5,<1",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
